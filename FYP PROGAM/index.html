<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FindYourProgram</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @media (max-width: 768px) {
            .logo-img {
                max-height: 60px;
            }
            .hero h1 {
                font-size: 1.8rem;
            }
            .hero ul {
                padding: 0 1rem;
            }
            .hero li {
                font-size: 0.9rem;
                padding-left: 1.2rem;
            }
            .btn-start {
                padding: 0.7rem 1.5rem;

            }
            footer {
                font-size: 0.7rem;
                padding: 1rem 0.5rem;
            }
        }
        @media (max-width: 480px) {
            .hero h1 {
                font-size: 1.4rem;
            }
            .hero li {
                font-size: 0.8rem;
            }
            .btn-start {
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

<div class="background-wrapper">
    <header class="logo">
        <img src="img/logo.png" alt="FYP Logo" class="logo-img">

        <h1>FindYourProgram</h1>
        <ul>
            <li>Discover college programs that match your interests.</li>
            <li>Compare recommendations based on your skills.</li>
            <li>Get personalized results for your future career.</li>
        </ul>

        <div class="cta">
            <a href="demographic.html">
                <button class="btn-start">Start Assessment</button>
            </a>

    <footer>
        <p>FYP © 2026 | Privacy Policy | <a href="about.html">About</a> | <a href="../../FYP ADMIN/admin-login.html">Admin Login</a></p>
