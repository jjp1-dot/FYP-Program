<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
<title>FYP Assessment Result</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f5f7fb;
        min-height: 100vh;
        padding: 40px 24px;
        position: relative;
    }
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url('img/bg2.png') no-repeat center center fixed;
        background-size: cover;
        z-index: -2;
    }
    body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.85);
        z-index: -1;
    }
    .container {
        max-width: 1280px;
        margin: 0 auto;
    }
    .main-card {
        background: white;
        border-radius: 32px;
        box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
        overflow: hidden;
        margin-bottom: 32px;
    }
    .result-header {
        background: linear-gradient(135deg, #0f3b4f 0%, #1e5a72 100%);
        padding: 32px 40px;
        color: white;
    }
    .result-header h1 {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.3px;
        margin-bottom: 8px;
    }
    .result-header p {
        opacity: 0.85;
        font-size: 1rem;
    }
    .profile-summary {
        background: #f8fafc;
        padding: 14px 24px;
        border-bottom: 1px solid #eef2ff;
        font-size: 0.9rem;
        color: #334155;
    }
    .profile-summary span {
        font-weight: 600;
        color: #0f3b4f;
    }
    .result-details {
        padding: 40px;
    }
    .dialogue-box {
        background: #eef2ff;
        padding: 20px 24px;
        border-left: 6px solid #2563eb;
        border-radius: 20px;
        margin-bottom: 28px;
        font-weight: 500;
        font-size: 1.1rem;
    }
    .ai-reasoning {
        background: #f1f5f9;
        padding: 18px;
        border-radius: 20px;
        margin: 20px 0;
        border-left: 4px solid #8b5cf6;
        line-height: 1.5;
    }
    .alternative-programs {
        margin: 20px 0;
    }
    .alternative-programs .badge {
        background: #e2e8f0;
        padding: 6px 14px;
        border-radius: 40px;
        font-size: 0.8rem;
        margin-right: 8px;
        display: inline-block;
        margin-bottom: 8px;
    }
    .confidence-badge {
        display: inline-block;
        background: #f59e0b;
        color: white;
        padding: 4px 12px;
        border-radius: 40px;
        font-size: 0.7rem;
        font-weight: 600;
        margin-left: 12px;
        vertical-align: middle;
    }
    .confidence-high { background: #10b981; }
    .confidence-medium { background: #f59e0b; }
    .confidence-low { background: #ef4444; }
    .compact-schools {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 2px solid #eef2ff;
    }
    .compact-schools h4 {
        font-size: 1.2rem;
        font-weight: 600;
        color: #0f3b4f;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .compact-schools h4::before {
        content: "🏫";
        font-size: 1.2rem;
    }
    .compact-school-card {
        background: #f8fafc;
        border-radius: 20px;
        padding: 18px;
        margin-bottom: 16px;
        transition: all 0.2s;
        border: 1px solid #eef2ff;
    }
    .compact-school-card:hover {
        transform: translateX(6px);
        border-color: #2563eb;
        background: white;
    }
    .compact-school-name {
        font-weight: 700;
        font-size: 1rem;
        margin-bottom: 6px;
    }
    .compact-school-location {
        font-size: 0.75rem;
        color: #5b6e8c;
        margin-bottom: 6px;
    }
    .compact-school-rank {
        display: inline-block;
        background: #2563eb;
        color: white;
        font-size: 0.65rem;
        font-weight: 600;
        padding: 2px 10px;
        border-radius: 20px;
        margin-bottom: 8px;
        margin-right: 8px;
    }
    .exam-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 40px;
        font-size: 0.7rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: white;
    }
    .exam-badge.true {
        background: #10b981;
    }
    .exam-badge.false {
        background: #e11d48;
    }
    .view-more-schools-btn {
        background: #10b981;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 40px;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.2s;
        width: 100%;
        margin-top: 24px;
    }
    .view-more-schools-btn:hover {
        background: #059669;
        transform: translateY(-2px);
    }
    .action-buttons {
        display: flex;
        gap: 16px;
        justify-content: flex-end;
        margin-top: 24px;
        margin-bottom: 32px;
        flex-wrap: wrap;
    }
    .btn {
        padding: 12px 28px;
        border-radius: 40px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
    }
    .btn-primary {
        background: #2563eb;
        color: white;
    }
    .btn-primary:hover {
        background: #1e4fd6;
        transform: translateY(-2px);
    }
    .btn-secondary {
        background: #e2e8f0;
        color: #1e293b;
    }
    .btn-secondary:hover {
        background: #cbd5e1;
    }
    .btn-download {
        background: #10b981;
        color: white;
    }
    .btn-download:hover {
        background: #059669;
    }
    .loading-schools {
        text-align: center;
        padding: 20px;
        color: #5b6e8c;
        font-size: 0.9rem;
    }
    .no-schools {
        text-align: center;
        padding: 20px;
        color: #94a3b8;
        background: #f8fafc;
        border-radius: 20px;
        font-size: 0.85rem;
    }

    /* ========== MOBILE RESPONSIVE ========== */
    @media (max-width: 850px) {
        body {
            padding: 20px;
        }
        .result-header {
            padding: 20px;
        }
        .result-header h1 {
            font-size: 1.6rem;
        }
        .result-header p {
            font-size: 0.85rem;
        }
        .result-details {
            padding: 24px;
        }
        .dialogue-box {
            padding: 14px 16px;
            margin-bottom: 20px;
        }
        .dialogue-box h2 {
            font-size: 1.2rem;
        }
        .confidence-badge {
            font-size: 0.6rem;
            padding: 2px 8px;
            margin-left: 6px;
        }
        .ai-reasoning {
            padding: 14px;
            font-size: 0.85rem;
        }
        .alternative-programs .badge {
            padding: 4px 10px;
            font-size: 0.7rem;
        }
        .compact-schools h4 {
            font-size: 1rem;
            margin-bottom: 12px;
        }
        .compact-school-card {
            padding: 12px;
            margin-bottom: 12px;
        }
        .compact-school-name {
            font-size: 0.9rem;
        }
        .compact-school-location {
            font-size: 0.7rem;
        }
        .exam-badge {
            padding: 2px 8px;
            font-size: 0.6rem;
        }
        .view-more-schools-btn {
            margin-top: 16px;
            padding: 10px 16px;
            font-size: 0.85rem;
        }
        .action-buttons {
            justify-content: center;
            gap: 12px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 0.9rem;
        }
    }

    @media (max-width: 550px) {
        body {
            padding: 12px;
        }
        .result-header h1 {
            font-size: 1.3rem;
        }
        .result-details {
            padding: 16px;
        }
        .dialogue-box h2 {
            font-size: 1rem;
        }
        .confidence-badge {
            font-size: 0.55rem;
            padding: 2px 6px;
        }
        .ai-reasoning {
            font-size: 0.8rem;
            padding: 10px;
        }
        .alternative-programs .badge {
            padding: 3px 8px;
            font-size: 0.65rem;
        }
        .compact-school-rank {
            font-size: 0.6rem;
            padding: 2px 6px;
        }
        .compact-school-name {
            font-size: 0.85rem;
        }
        .action-buttons {
            flex-direction: column;
            align-items: stretch;
        }
        .btn {
            width: 100%;
            text-align: center;
        }
        .view-more-schools-btn {
            font-size: 0.8rem;
        }
    }

    
    @media print {
        body {
            background: white;
            padding: 0;
            margin: 0;
        }
        body::before, body::after {
            display: none;
        }
        .action-buttons, .view-more-schools-btn, #downloadPdfBtn, #reloadBtn, #restartBtn {
            display: none !important;
        }
        .main-card {
            box-shadow: none;
            border-radius: 0;
            margin: 0.4in auto 0 auto;
            width: 100%;
            max-width: 100%;
        }
        .result-header {
            background: #0f3b4f;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            padding: 8px 20px;
            margin-bottom: 6px;
        }
        .result-header h1 {
            font-size: 1.4rem;
            margin-bottom: 2px;
        }
        .result-header p {
            font-size: 0.8rem;
            margin: 0;
        }
        .profile-summary {
            padding: 4px 20px;
            font-size: 0.75rem;
            background: #f8fafc;
            border-bottom: 1px solid #eef2ff;
            margin-bottom: 8px;
        }
        .result-details {
            padding: 10px 20px 30px 20px;
        }
        .dialogue-box {
            padding: 8px 14px;
            margin-bottom: 14px;
        }
        .dialogue-box h2 {
            font-size: 1.1rem;
            margin-top: 6px;
            margin-bottom: 0;
        }
        .confidence-badge {
            font-size: 0.65rem;
            padding: 2px 8px;
            margin-left: 8px;
        }
        .ai-reasoning {
            margin: 14px 0;
            padding: 10px 14px;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .alternative-programs {
            margin: 14px 0;
        }
        .alternative-programs .badge {
            padding: 4px 10px;
            font-size: 0.7rem;
            margin-right: 6px;
            margin-bottom: 4px;
        }
        .compact-schools {
            margin-top: 18px;
            padding-top: 8px;
            border-top: 1px solid #eef2ff;
        }
        .compact-schools h4 {
            font-size: 1rem;
            margin-bottom: 10px;
        }
        .compact-school-card {
            padding: 8px 12px;
            margin-bottom: 12px;
        }
        .compact-school-rank {
            font-size: 0.65rem;
            padding: 2px 8px;
            margin-bottom: 4px;
        }
        .compact-school-name {
            font-size: 0.9rem;
            margin-bottom: 2px;
        }
        .compact-school-location {
            font-size: 0.7rem;
            margin-bottom: 2px;
        }
        .exam-badge {
            padding: 2px 8px;
            font-size: 0.6rem;
            margin-bottom: 4px;
        }
        .compact-school-website a {
            font-size: 0.65rem;
        }
        .compact-school-card:last-child {
            margin-bottom: 0;
        }
    }
</style>
</head>
<body>
<div class="container">
    <div class="main-card">
        <div class="result-header">
            <h1>🎯 Your Personalized Result</h1>
            <p>Based on your answers, we found the best path for you</p>
        </div>
        <div id="profileSummary" class="profile-summary" style="display: none;"></div>
        <div class="result-details" id="resultContainer">
            
        </div>
        <div style="padding: 0 40px 40px 40px;">
            <button id="viewMoreSchoolsBtn" class="view-more-schools-btn">🔍 View More Schools →</button>
        </div>
    </div>

    <div class="action-buttons">
        <button id="downloadPdfBtn" class="btn btn-download">📄 Download Results (PDF)</button>
        <button id="reloadBtn" class="btn btn-secondary">⟳ Reload Results</button>
        <button id="restartBtn" class="btn btn-primary">⟳ Restart Assessment</button>
    </div>
</div>

<script>

const API_BASE = 'http://localhost:5000/api';

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function clearAllAssessmentData() {
    localStorage.removeItem('answers');
    localStorage.removeItem('assessmentAnswers');
    localStorage.removeItem('recommendation');
    localStorage.removeItem('fyp_user_profile');
    localStorage.removeItem('userName');
    localStorage.removeItem('userAge');
    localStorage.removeItem('userGender');
    localStorage.removeItem('userStrand');
    localStorage.removeItem('userGrade');
    localStorage.removeItem('profileCompleted');
    localStorage.removeItem('assessmentStarted');
    localStorage.removeItem('lastQuestionIndex');
    console.log("Full reset completed.");
}

document.getElementById('restartBtn').addEventListener('click', function() {
    clearAllAssessmentData();
    window.location.href = 'index.html';
});

document.getElementById('reloadBtn').addEventListener('click', function() {
    location.reload();
});

document.getElementById('viewMoreSchoolsBtn').addEventListener('click', function() {
    const topCategory = localStorage.getItem('topCategoryFull') || '';
    if (topCategory) {
        window.location.href = `schools.html?category=${encodeURIComponent(topCategory)}`;
    } else {
        alert('School list page coming soon!');
    }
});

document.getElementById('downloadPdfBtn').addEventListener('click', function() {
    window.print();
});

function displayProfileSummary() {
    const profileDiv = document.getElementById('profileSummary');
    try {
        let profile = localStorage.getItem('fyp_user_profile');
        let userName = '';
        let userGrade = '';
        let userStrand = '';
        if (profile) {
            const p = JSON.parse(profile);
            userName = p.userName || '';
            userGrade = p.userGrade || '';
            userStrand = p.userStrand || '';
        }
        if (!userName) userName = localStorage.getItem('userName') || '';
        if (!userGrade) userGrade = localStorage.getItem('userGrade') || '';
        if (!userStrand) userStrand = localStorage.getItem('userStrand') || '';
        if (userName) {
            let strandText = (userStrand && userStrand.trim()) ? ` • Strand: ${escapeHtml(userStrand)}` : '';
            let gradeText = userGrade ? `Grade ${escapeHtml(userGrade)}` : '';
            profileDiv.innerHTML = `👤 <span>${escapeHtml(userName)}</span> ${gradeText ? `• ${gradeText}` : ''} ${strandText}`;
            profileDiv.style.display = 'block';
        } else {
            profileDiv.style.display = 'none';
        }
    } catch(e) {
        profileDiv.style.display = 'none';
    }
}

async function fetchTopSchoolsForCategory(categoryName, limit = 3) {
    try {
        const response = await fetch(`${API_BASE}/schools`);
        if (!response.ok) throw new Error('Failed to fetch schools');
        const allSchools = await response.json();
        const matching = allSchools.filter(school => {
            return school.rankings && school.rankings[categoryName] !== undefined;
        });
        matching.sort((a, b) => a.rankings[categoryName] - b.rankings[categoryName]);
        return matching.slice(0, limit);
    } catch (err) {
        console.error('Error fetching schools:', err);
        return [];
    }
}

function renderCompactSchools(schools, categoryName) {
    if (!schools.length) return '<div class="no-schools">🏫 No top schools found for this category.</div>';
    let html = `<div class="compact-schools"><h4>Top Schools for ${categoryName}</h4>`;
    schools.forEach(school => {
        const rank = school.rankings[categoryName];
        const examBadge = school.entranceExam 
            ? '<div class="exam-badge true">✓ Entrance Exam</div>' 
            : '<div class="exam-badge false">✗ No Entrance Exam</div>';
        html += `
            <div class="compact-school-card">
                <div class="compact-school-rank">#${rank} Ranked</div>
                ${examBadge}
                <div class="compact-school-name">${escapeHtml(school.schoolName)}</div>
                <div class="compact-school-location">${escapeHtml(school.location)}</div>
                ${school.website ? `<div class="compact-school-website"><a href="${escapeHtml(school.website)}" target="_blank" style="font-size:0.7rem;">Visit website →</a></div>` : ''}
            </div>
        `;
    });
    html += `</div>`;
    return html;
}
function mapProgramToCategory(program) {
    const p = program.toLowerCase();
    if (p.includes("information technology") || p.includes("computer science") || p.includes("software") || p.includes("data science") || p.includes("it") || p.includes("programming") || p.includes("computing")) 
        return "Technology & Computing";
    if (p.includes("nursing") || p.includes("medical") || p.includes("health") || p.includes("biology") || p.includes("biochemistry") || p.includes("pharmacy") || p.includes("medicine") || p.includes("life sciences") || p.includes("radiology") || p.includes("physical therapy"))
        return "Health & Life Sciences";
    if (p.includes("education") || p.includes("teaching") || p.includes("pedagogy") || p.includes("early childhood") || p.includes("secondary education"))
        return "Education & Social Sciences";
    if (p.includes("business") || p.includes("accountancy") || p.includes("marketing") || p.includes("management") || p.includes("entrepreneurship") || p.includes("finance") || p.includes("administration"))
        return "Business & Management";
    if (p.includes("multimedia") || p.includes("design") || p.includes("arts") || p.includes("animation") || p.includes("film") || p.includes("creative") || p.includes("digital media") || p.includes("graphic design"))
        return "Creative Arts & Media";
    return "Technology & Computing";
}

window.onload = async function() {
    let recommendation = null;
    const storedRec = localStorage.getItem('recommendation');
    if (storedRec) {
        try {
            recommendation = JSON.parse(storedRec);
        } catch(e) {}
    }

    if (!recommendation || !recommendation.recommendedProgram) {
        document.getElementById("resultContainer").innerHTML = `
            <div class="dialogue-box" style="background:#fff3e0; border-left-color:#f97316;">
                ⚠️ No assessment data found.
            </div>
            <p>Please complete the assessment first.</p>
        `;
        displayProfileSummary();
        return;
    }

    let confidenceClass = "confidence-medium";
    if (recommendation.confidence === "High") confidenceClass = "confidence-high";
    else if (recommendation.confidence === "Low") confidenceClass = "confidence-low";

    let resultHtml = `
        <div class="dialogue-box">
            🎓 Your most suitable field is:
            <h2>${escapeHtml(recommendation.recommendedProgram)} <span class="confidence-badge ${confidenceClass}">${escapeHtml(recommendation.confidence || "Medium")} confidence</span></h2>
        </div>
        <div class="ai-reasoning">
            <strong>🤖 AI Analysis:</strong> ${escapeHtml(recommendation.reasoning || "Based on your answers, this program is an excellent fit.")}
        </div>
    `;

    if (recommendation.alternativePrograms && recommendation.alternativePrograms.length) {
        resultHtml += `<div class="alternative-programs">
            <strong>📌 Also consider:</strong> ${recommendation.alternativePrograms.map(p => `<span class="badge">${escapeHtml(p)}</span>`).join(' ')}
        </div>`;
    }

    const mappedCategory = mapProgramToCategory(recommendation.recommendedProgram);
    localStorage.setItem('topCategoryFull', mappedCategory);

    const topSchools = await fetchTopSchoolsForCategory(mappedCategory, 3);
    if (topSchools.length > 0) {
        resultHtml += renderCompactSchools(topSchools, mappedCategory);
    } else {
        resultHtml += `<div class="compact-schools"><h4>🏫 Top Schools</h4><div class="no-schools">No top schools found for this category.</div></div>`;
    }

    document.getElementById("resultContainer").innerHTML = resultHtml;
    displayProfileSummary();
};
</script>
</body>
</html>
