<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FYP Assessment</title>
<style>
/* Page background & container */
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    margin: 0;
    padding: 0;
    text-align: center;
}
.container {
    max-width: 900px;
    margin: 50px auto;
    padding: 20px;
}

/* Progress bar */
.progress-container {
    width: 100%;
    background: #ddd;
    height: 20px;
    border-radius: 10px;
    margin-bottom: 30px;
}
#progress-bar {
    height: 100%;
    width: 0%;
    background: #2563eb;
    border-radius: 10px;
    transition: width 0.3s;
}

/* Question box */
#question-container {
    background: #fff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    margin-bottom: 20px;
    text-align: left;
}
#question-container h3 {
    font-size: 24px;
    margin-bottom: 20px;
}

/* Option buttons with alternating shades */
.option-btn {
    display: block;
    width: 100%;
    padding: 12px 20px;
    margin: 8px 0;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: #1e3a8a;
    transition: background 0.2s, transform 0.1s;
}

/* Alternating background colors */
.option-btn:nth-child(odd) {
    background-color: #dbeafe; /* light blue */
}
.option-btn:nth-child(even) {
    background-color: #bfdbfe; /* slightly darker */
}

/* Hover effect */
.option-btn:hover {
    background-color: #2563eb; /* strong blue */
    color: white;
    transform: scale(1.03);
}
.option-btn:active {
    transform: scale(0.97);
}

/* Back button */
#backBtn {
    display: block;
    width: 50%;
    padding: 10px 0;
    margin: 20px auto 0;
    font-size: 16px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background-color: #888;
    color: white;
}
#backBtn:hover {
    background-color: #555;
}
</style>
</head>
<body>

<div class="container">
    <h1>Find Your Program Assessment</h1>

    <div id="question-container"></div>

    <!-- Progress bar moved below the question -->
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
