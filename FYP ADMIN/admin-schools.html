<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Manage Schools | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: relative;
                height: auto;
                padding: 1rem;
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between;
                align-items: center;
            }
            .logo {
                margin-bottom: 0;
            }
            .nav {
                margin-top: 0;
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }
            .nav-item {
                padding: 8px 12px;
                margin: 0;
                font-size: 0.8rem;
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .admin-profile {
                width: 100%;
                justify-content: space-between;
            }
            .card {
                padding: 20px;
            }
            .card > div:first-child {
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
            }
            button {
                width: 100%;
                justify-content: center;
            }
            /* rankings grid */
            #schoolForm div[style*="grid-template-columns"] {
                grid-template-columns: 1fr !important;
                gap: 8px;
            }
            .school-item {
                padding: 16px;
            }
            .school-header {
                font-size: 1rem;
            }
            .detail {
                font-size: 0.8rem;
            }
            .actions button {
                margin-right: 8px;
                padding: 6px 12px;
            }
        }
        @media (max-width: 480px) {
            .sidebar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .nav {
                justify-content: center;
            }
            .nav-item {
                padding: 6px 10px;
                font-size: 0.7rem;
            }
            .page-title h1 {
                font-size: 1.3rem;
            }
            .card h3 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="sidebar">
        <div class="logo"><h2><i class="fas fa-graduation-cap"></i> FYP: ADMIN</h2></div>
        <div class="nav">
            <a href="admin-dashboard.html" class="nav-item"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
            <a href="admin-questions.html" class="nav-item"><i class="fas fa-question-circle"></i><span>Questions</span></a>
            <a href="admin-schools.html" class="nav-item active"><i class="fas fa-school"></i><span>Schools</span></a>
            <a href="admin-responses.html" class="nav-item"><i class="fas fa-comments"></i><span>Responses</span></a>
            <a href="admin-cms.html" class="nav-item"><i class="fas fa-user-cog"></i><span>CMS</span></a>
        </div>
    </div>
    <div class="main-content">
        <div class="top-bar">
            <div class="page-title"><h1>Schools</h1><p>Manage partner institutions</p></div>
            <div class="admin-profile"><span>Admin</span><div class="avatar">A</div><button onclick="logout()" style="background:#e11d48;">Logout</button></div>
        </div>
        <div class="card">
            <div style="display:flex; justify-content:space-between;">
                <h3><i class="fas fa-building"></i> All Schools</h3>
                <button onclick="showSchoolForm()">+ Add School</button>
            </div>
            <div id="schoolsList">Loading...</div>
            <div id="message" class="message" style="display:none;"></div>
        </div>
    </div>
</div>
<script src="admin.js"></script>
<script>
    let editingSchoolId = null;

    async function loadSchools() {
        const container = document.getElementById('schoolsList');
        try {
            const res = await fetch(`${API_BASE}/schools`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const schools = await res.json();
            container.innerHTML = '';
            if (schools.length === 0) {
                container.innerHTML = '<p>No schools found. Add your first school.</p>';
                return;
            }
            schools.forEach(s => {
                const rankings = s.rankings || {};
                const div = document.createElement('div');
                div.className = 'school-item';
                div.innerHTML = `
                    <div class="school-header"><strong>${escapeHtml(s.schoolName)}</strong> - ${escapeHtml(s.location)}</div>
                    <div class="detail">Rankings:</div>
                    <div class="detail">Technology & Computing: ${rankings['Technology & Computing'] || '-'}</div>
                    <div class="detail">Health & Life Sciences: ${rankings['Health & Life Sciences'] || '-'}</div>
                    <div class="detail">Education & Social Sciences: ${rankings['Education & Social Sciences'] || '-'}</div>
                    <div class="detail">Business & Management: ${rankings['Business & Management'] || '-'}</div>
                    <div class="detail">Creative Arts & Media: ${rankings['Creative Arts & Media'] || '-'}</div>
                    <div class="detail">Website: <a href="${escapeHtml(s.website)}" target="_blank">${escapeHtml(s.website)}</a></div>
                    <div class="actions">
                        <button onclick="editSchool('${s._id}')">✏️ Edit</button>
                        <button onclick="deleteSchool('${s._id}')">🗑️ Delete</button>
                    </div>
                `;
                container.appendChild(div);
            });
        } catch (err) {
            console.error('Load schools error:', err);
            container.innerHTML = '<p class="error">Failed to load schools. Make sure backend is running.</p>';
        }
    }

    function showSchoolForm(school = null) {
        editingSchoolId = school?._id || null;
        const rankings = school?.rankings || {};
        const html = `
            <div id="schoolForm" style="background:#f8fafc; padding:20px; border-radius:20px; margin-bottom:20px;">
                <h4>${editingSchoolId ? 'Edit' : 'Add'} School</h4>
                <input type="text" id="schoolName" placeholder="School Name" value="${escapeHtml(school?.schoolName || '')}">
                <input type="text" id="location" placeholder="Location" value="${escapeHtml(school?.location || '')}">
                <label>Rankings (lower number = better)</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>Technology & Computing: <input type="number" id="rankTech" value="${rankings['Technology & Computing'] || ''}" placeholder="1-100"></div>
                    <div>Health & Life Sciences: <input type="number" id="rankHealth" value="${rankings['Health & Life Sciences'] || ''}" placeholder="1-100"></div>
                    <div>Education & Social Sciences: <input type="number" id="rankEdu" value="${rankings['Education & Social Sciences'] || ''}" placeholder="1-100"></div>
                    <div>Business & Management: <input type="number" id="rankBiz" value="${rankings['Business & Management'] || ''}" placeholder="1-100"></div>
                    <div>Creative Arts & Media: <input type="number" id="rankCreative" value="${rankings['Creative Arts & Media'] || ''}" placeholder="1-100"></div>
                </div>
                <label>Website URL</label>
                <input type="text" id="website" placeholder="https://..." value="${escapeHtml(school?.website || '')}">
                <div style="margin-top: 15px;">
                    <button onclick="saveSchool()">Save</button>
                    <button onclick="cancelSchoolForm()">Cancel</button>
                </div>
            </div>
        `;
        const existing = document.getElementById('schoolForm');
        if (existing) existing.remove();
        document.getElementById('schoolsList').insertAdjacentHTML('beforebegin', html);
    }

    async function saveSchool() {
        const schoolName = document.getElementById('schoolName').value.trim();
        const location = document.getElementById('location').value.trim();
        if (!schoolName) {
            showMessage('School name is required', 'error');
            return;
        }

        const rankings = {};
        const tech = document.getElementById('rankTech').value;
        const health = document.getElementById('rankHealth').value;
        const edu = document.getElementById('rankEdu').value;
        const biz = document.getElementById('rankBiz').value;
        const creative = document.getElementById('rankCreative').value;
        if (tech) rankings['Technology & Computing'] = parseInt(tech);
        if (health) rankings['Health & Life Sciences'] = parseInt(health);
        if (edu) rankings['Education & Social Sciences'] = parseInt(edu);
        if (biz) rankings['Business & Management'] = parseInt(biz);
        if (creative) rankings['Creative Arts & Media'] = parseInt(creative);

        const payload = {
            schoolName: schoolName,
            location: location,
            rankings: rankings,
            website: document.getElementById('website').value.trim()
        };

        try {
            let response;
            if (editingSchoolId) {
                response = await fetchWithAuth(`/schools/${editingSchoolId}`, {
                    method: 'PUT',
                    body: JSON.stringify(payload)
                });
            } else {
                response = await fetchWithAuth('/schools', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
            }
            if (!response.ok) throw new Error('Save failed');
            showMessage(editingSchoolId ? 'School updated successfully!' : 'School added successfully!', 'success');
            cancelSchoolForm();
            loadSchools(); 
        } catch (err) {
            console.error(err);
            showMessage('Error saving school. Make sure you are logged in.', 'error');
        }
    }

    async function editSchool(id) {
        try {
            const res = await fetch(`${API_BASE}/schools`);
            const schools = await res.json();
            const school = schools.find(s => s._id === id);
            if (school) {
                showSchoolForm(school);
            } else {
                showMessage('School not found', 'error');
            }
        } catch (err) {
            showMessage('Error loading school details', 'error');
        }
    }

    async function deleteSchool(id) {
        if (!confirm('Delete this school permanently? This action cannot be undone.')) return;
        try {
            const response = await fetchWithAuth(`/schools/${id}`, { method: 'DELETE' });
            if (!response.ok) throw new Error('Delete failed');
            showMessage('School deleted successfully', 'success');
            loadSchools(); // refresh list
        } catch (err) {
            showMessage('Error deleting school', 'error');
        }
    }

    function cancelSchoolForm() {
        const form = document.getElementById('schoolForm');
        if (form) form.remove();
        loadSchools();
    }

    function showMessage(msg, type) {
        const msgDiv = document.getElementById('message');
        msgDiv.textContent = msg;
        msgDiv.className = `message ${type}`;
        msgDiv.style.display = 'block';
        setTimeout(() => msgDiv.style.display = 'none', 3000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    if (checkAuth()) {
        loadSchools();
        highlightActiveNav();
    }
</script>
</body>
</html>
