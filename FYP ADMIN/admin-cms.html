<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CMS | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-container">
    <div class="sidebar"><div class="logo"><h2><i class="fas fa-graduation-cap"></i> FYP : ADMIN</h2><p>College Recommender</p></div>
        <div class="nav">
            <a href="admin-dashboard.html" class="nav-item"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
            <a href="admin-questions.html" class="nav-item"><i class="fas fa-question-circle"></i><span>Questions</span></a>
            <a href="admin-schools.html" class="nav-item"><i class="fas fa-school"></i><span>Schools</span></a>
            <a href="admin-cms.html" class="nav-item active"><i class="fas fa-palette"></i><span>CMS</span></a>
        </div>
    </div>
    <div class="main-content">
        <div class="top-bar"><div class="page-title"><h1>Content Management</h1><p>Customize site appearance</p></div>
            <div class="admin-profile"><span>Admin</span><div class="avatar">A</div><button onclick="logout()" style="background:#e11d48;">Logout</button></div>
        </div>
        <div class="card"><h3><i class="fas fa-paint-brush"></i> Site Settings</h3>
            <form id="cmsForm"><div class="form-group"><label>Site Title</label><input type="text" id="siteTitle"></div>
            <div class="form-group"><label>Subtitle</label><input type="text" id="siteSubtitle"></div>
            <div class="form-group"><label>Logo URL</label><input type="text" id="logoUrl"></div>
            <div class="form-group"><label>Primary Color</label><input type="color" id="primaryColor"></div>
            <div class="form-group"><label>Secondary Color</label><input type="color" id="secondaryColor"></div>
            <div class="form-group"><label>Font Family</label><input type="text" id="fontFamily" placeholder="Inter, sans-serif"></div>
            <button type="submit">Save Changes</button></form>
            <div id="message" class="message" style="display:none;"></div>
        </div>
    </div>
</div>
<script src="admin.js"></script>
<script>
    async function loadCMS() {
        const cms = mockCMS; // from admin.js
        document.getElementById('siteTitle').value = cms.siteTitle;
        document.getElementById('siteSubtitle').value = cms.siteSubtitle;
        document.getElementById('logoUrl').value = cms.logoUrl;
        document.getElementById('primaryColor').value = cms.primaryColor;
        document.getElementById('secondaryColor').value = cms.secondaryColor;
        document.getElementById('fontFamily').value = cms.fontFamily;
    }
    document.getElementById('cmsForm').addEventListener('submit', (e) => {
        e.preventDefault();
        Object.assign(mockCMS, {
            siteTitle: document.getElementById('siteTitle').value,
            siteSubtitle: document.getElementById('siteSubtitle').value,
            logoUrl: document.getElementById('logoUrl').value,
            primaryColor: document.getElementById('primaryColor').value,
            secondaryColor: document.getElementById('secondaryColor').value,
            fontFamily: document.getElementById('fontFamily').value
        });
        showMessage('CMS updated!','success');
    });
    function showMessage(msg,type) { const d=document.getElementById('message'); d.textContent=msg; d.className=`message ${type}`; d.style.display='block'; setTimeout(()=>d.style.display='none',2000); }
    loadCMS(); highlightActiveNav();
</script>
</body>
</html>
