<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Account | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-container">
    <div class="sidebar">
        <div class="logo"><h2><i class="fas fa-graduation-cap"></i> FYP: ADMIN </h2></div>
        <div class="nav">
            <a href="admin-dashboard.html" class="nav-item"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
            <a href="admin-questions.html" class="nav-item"><i class="fas fa-question-circle"></i><span>Questions</span></a>
            <a href="admin-schools.html" class="nav-item"><i class="fas fa-school"></i><span>Schools</span></a>
            <a href="admin-cms.html" class="nav-item active"><i class="fas fa-user-cog"></i><span>CMS</span></a>
        </div>
    </div>
    <div class="main-content">
        <div class="top-bar">
            <div class="page-title"><h1>Admin Account</h1><p>Update your login credentials</p></div>
            <div class="admin-profile"><span>Admin</span><div class="avatar">A</div><button onclick="logout()" style="background:#e11d48;">Logout</button></div>
        </div>

        <div class="card">
            <h3><i class="fas fa-user-cog"></i> Change Username / Password</h3>
            <form id="adminForm">
                <div class="form-group">
                    <label>New Username</label>
                    <input type="text" id="adminUsername" placeholder="Leave blank to keep current">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="adminPassword" placeholder="Leave blank to keep current">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword">
                </div>
                <button type="submit" id="saveAdminBtn">Update Account</button>
                <div id="adminFeedback" class="message" style="display:none;"></div>
            </form>
        </div>
    </div>
</div>
<script src="admin.js"></script>
<script>
    document.getElementById('adminForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const feedbackDiv = document.getElementById('adminFeedback');
        const saveBtn = document.getElementById('saveAdminBtn');
        const originalText = saveBtn.innerHTML;
        saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
        saveBtn.disabled = true;
        feedbackDiv.style.display = 'none';

        const newUsername = document.getElementById('adminUsername').value.trim();
        const newPassword = document.getElementById('adminPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
            feedbackDiv.textContent = '❌ Passwords do not match.';
            feedbackDiv.className = 'message error';
            feedbackDiv.style.display = 'block';
            saveBtn.innerHTML = originalText;
            saveBtn.disabled = false;
            return;
        }

        const payload = {};
        if (newUsername) payload.username = newUsername;
        if (newPassword) payload.password = newPassword;

        if (Object.keys(payload).length === 0) {
            feedbackDiv.textContent = '❌ No changes provided.';
            feedbackDiv.className = 'message error';
            feedbackDiv.style.display = 'block';
            saveBtn.innerHTML = originalText;
            saveBtn.disabled = false;
            return;
        }

        try {
            const res = await fetchWithAuth('/admin/profile', { method: 'PUT', body: JSON.stringify(payload) });
            // Check if response is JSON
            const contentType = res.headers.get('content-type');
            if (!contentType || !contentType.includes('application/json')) {
                const text = await res.text();
                throw new Error(`Server returned non-JSON: ${text.substring(0, 100)}`);
            }
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Update failed');
            feedbackDiv.textContent = '✅ Admin account updated! You will be logged out.';
            feedbackDiv.className = 'message success';
            feedbackDiv.style.display = 'block';
            setTimeout(() => {
                localStorage.removeItem('adminToken');
                window.location.href = 'admin-login.html';
            }, 2000);
        } catch (err) {
            console.error('Admin update error:', err);
            feedbackDiv.textContent = `❌ Error: ${err.message}`;
            feedbackDiv.className = 'message error';
            feedbackDiv.style.display = 'block';
            saveBtn.innerHTML = originalText;
            saveBtn.disabled = false;
        }
    });

    if (checkAuth()) {
        highlightActiveNav();
    }
</script>
</body>
</html>
