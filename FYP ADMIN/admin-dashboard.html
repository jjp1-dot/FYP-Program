<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* Emergency fix: ensure buttons are always visible */
        #refreshBtn, #logoutBtn {
            display: inline-flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            background: #2c6e9e !important;
        }
        #logoutBtn {
            background: #e11d48 !important;
        }
        #logoutBtn:hover {
            background: #be123c !important;
        }
        .admin-profile button {
            height: 38px;
            margin: 0 5px;
        }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="sidebar">
        <div class="logo"><h2><i class="fas fa-graduation-cap"></i> FYP: ADMIN </h2></div>
        <div class="nav">
            <a href="admin-dashboard.html" class="nav-item"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
            <a href="admin-questions.html" class="nav-item"><i class="fas fa-question-circle"></i><span>Questions</span></a>
            <a href="admin-schools.html" class="nav-item"><i class="fas fa-school"></i><span>Schools</span></a>
            <a href="admin-cms.html" class="nav-item"><i class="fas fa-palette"></i><span>CMS</span></a>
        </div>
    </div>
    <div class="main-content">
        <div class="top-bar">
            <div class="page-title"><h1>Dashboard</h1><p>Live analytics from student responses</p></div>
            <div class="admin-profile">
                <span>Admin</span>
                <div class="avatar">A</div>
                <button id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
                <button id="logoutBtn">Logout</button>
            </div>
        </div>
        <div id="statsGrid" class="stats-grid">Loading...</div>
        <div class="row">
            <div class="card"><h3><i class="fas fa-venus-mars"></i> Gender Distribution</h3><canvas id="genderChart"></canvas></div>
            <div class="card"><h3><i class="fas fa-trophy"></i> Top Recommended Programs</h3><div id="programRanking">Loading...</div></div>
        </div>
        <div class="row">
            <div class="card"><h3><i class="fas fa-chart-line"></i> Category Interest</h3><canvas id="categoryChart"></canvas></div>
            <div class="card"><h3><i class="fas fa-user-check"></i> Total Students Guided</h3><div id="totalAssessments" style="font-size:3rem; font-weight:800;">-</div><p>Average age: <span id="avgAge">—</span></p></div>
        </div>
    </div>
</div>
<script src="admin.js"></script>
<script>
    let genderChart, categoryChart;
    let refreshInterval;

    async function loadDashboard() {
        try {
            const res = await fetchWithAuth('/analytics/summary');
            const data = await res.json();
            renderStats(data);
            renderGenderChart(data.genderDistribution);
            renderProgramRanking(data.topPrograms || []);
            renderCategoryChart(data.categoryInterest || []);
            document.getElementById('totalAssessments').innerText = data.totalAssessments || 0;
            document.getElementById('avgAge').innerText = data.averageAge || '—';
        } catch (err) {
            document.getElementById('statsGrid').innerHTML = '<p class="error">Failed to load analytics. Make sure backend is running.</p>';
        }
    }

    function renderStats(data) {
        const grid = document.getElementById('statsGrid');
        grid.innerHTML = `
            <div class="stat-card"><div class="stat-title">Total Assessments</div><div class="stat-value">${data.totalAssessments || 0}</div></div>
            <div class="stat-card"><div class="stat-title">Average Age</div><div class="stat-value">${data.averageAge || 0} yrs</div></div>
            <div class="stat-card"><div class="stat-title">Most Recommended Category</div><div class="stat-value">${data.mostRecommendedCategory || 'N/A'}</div></div>
        `;
    }

    function renderGenderChart(genderDist) {
        const ctx = document.getElementById('genderChart').getContext('2d');
        if (genderChart) genderChart.destroy();
        genderChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Male', 'Female', 'Other'],
                datasets: [{ data: [genderDist.male || 0, genderDist.female || 0, genderDist.other || 0], backgroundColor: ['#3b82f6', '#f472b6', '#94a3b8'] }]
            },
            options: { responsive: true, maintainAspectRatio: true }
        });
    }

    function renderProgramRanking(programs) {
        const container = document.getElementById('programRanking');
        if (!programs.length) { container.innerHTML = '<p>No data yet</p>'; return; }
        container.innerHTML = programs.map((p, i) => `
            <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #e2edf2;">
                <span>${i+1}. ${p.name}</span>
                <span class="badge">${p.count} recs</span>
            </div>
        `).join('');
    }

    function renderCategoryChart(categories) {
        const ctx = document.getElementById('categoryChart').getContext('2d');
        if (categoryChart) categoryChart.destroy();
        categoryChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: categories.map(c => c.category),
                datasets: [{ label: 'Interest (%)', data: categories.map(c => c.percentage), backgroundColor: '#2c6e9e', borderRadius: 10 }]
            },
            options: { indexAxis: 'y', responsive: true, scales: { x: { max: 100 } }, maintainAspectRatio: true }
        });
    }

    function refreshDashboard() {
        loadDashboard(); // Just reload data, no button text changes
    }

    function startAutoRefresh() {
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            if (checkAuth()) {
                loadDashboard();
            }
        }, 30000);
    }

    if (checkAuth()) {
        loadCMSSettings().then(() => {
            loadDashboard();
            startAutoRefresh();
        });
        highlightActiveNav();
        document.getElementById('refreshBtn').addEventListener('click', refreshDashboard);
        document.getElementById('logoutBtn').addEventListener('click', logout);
    }
</script>
</body>
</html>
