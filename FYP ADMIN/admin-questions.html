<body>

            <div id="message" class="message" style="display:none;"></div>

</div>

<script src="admin.js"></script>

        ]},
        { questionText: "How would your friends describe you?", order: 7, isActive: true, choices: [
            { text: "Analytical and logical", category: "Technology", weight: 1 },
            { text: "Curious and observant", category: "Healthcare", weight: 1 },
            { text: "Communicative and expressive", category: "Education", weight: 1 },
            { text: "Leader and organizer", category: "Business", weight: 1 },
            { text: "Creative and imaginative", category: "Creative Arts", weight: 1 }
        ]},
        { questionText: "What type of project would you enjoy the most?", order: 8, isActive: true, choices: [

            { text: "Conducting a scientific experiment", category: "Healthcare", weight: 1 },
            { text: "Writing a blog or article", category: "Education", weight: 1 },

        ]},

            { text: "Educating or inspiring others", category: "Education", weight: 1 },

        ]},
        { questionText: "Which type of school project do you enjoy the most?", order: 11, isActive: true, choices: [
            { text: "Building a website, app, or technical project", category: "Technology", weight: 1 },
            { text: "Researching scientific topics or conducting experiments", category: "Healthcare", weight: 1 },

        ]},
        { questionText: "What kind of problems do you enjoy solving in your free time?", order: 12, isActive: true, choices: [
            { text: "Computer or technology-related issues", category: "Technology", weight: 1 },
            { text: "Scientific or health-related questions", category: "Healthcare", weight: 1 },
            { text: "Social or community issues", category: "Education", weight: 1 },

        ]},

        ]},
        { questionText: "What type of achievement would make you the proudest?", order: 15, isActive: true, choices: [

            { text: "Helping people learn or understand ideas", category: "Education", weight: 1 },

        ]},
        { questionText: "Which task sounds the most interesting to you?", order: 16, isActive: true, choices: [
            { text: "Developing a computer system", category: "Technology", weight: 1 },
            { text: "Studying diseases and health conditions", category: "Healthcare", weight: 1 },
            { text: "Teaching or mentoring others", category: "Education", weight: 1 },
            { text: "Managing a company or team", category: "Business", weight: 1 },
            { text: "Producing films, music, or digital media", category: "Creative Arts", weight: 1 }
        ]},
        { questionText: "What kind of class activity excites you the most?", order: 17, isActive: true, choices: [
            { text: "Coding or technology-based activities", category: "Technology", weight: 1 },
            { text: "Laboratory experiments", category: "Healthcare", weight: 1 },
            { text: "Group discussions and presentations", category: "Education", weight: 1 },
            { text: "Business simulations or case studies", category: "Business", weight: 1 },
            { text: "Art or design projects", category: "Creative Arts", weight: 1 }
        ]},
        { questionText: "If you were to join a club, which would you pick?", order: 18, isActive: true, choices: [
            { text: "Programming or robotics club", category: "Technology", weight: 1 },
            { text: "Science or medical club", category: "Healthcare", weight: 1 },
            { text: "Debate or writing club", category: "Education", weight: 1 },
            { text: "Entrepreneurship club", category: "Business", weight: 1 },
            { text: "Arts or multimedia club", category: "Creative Arts", weight: 1 }
        ]},
        { questionText: "What type of career impact do you want to make?", order: 19, isActive: true, choices: [
            { text: "Innovate technology that improves everyday life", category: "Technology", weight: 1 },
            { text: "Improve health and scientific knowledge", category: "Healthcare", weight: 1 },
            { text: "Educate and inspire people", category: "Education", weight: 1 },
            { text: "Grow businesses and create jobs", category: "Business", weight: 1 },
            { text: "Inspire people through creative works", category: "Creative Arts", weight: 1 }
        ]},
        { questionText: "Which activity sounds the most enjoyable for you?", order: 20, isActive: true, choices: [
            { text: "Building computers or apps", category: "Technology", weight: 1 },
            { text: "Studying the human body or nature", category: "Healthcare", weight: 1 },
            { text: "Writing, speaking, or teaching", category: "Education", weight: 1 },
            { text: "Planning business strategies", category: "Business", weight: 1 },
            { text: "Creating designs, videos, or artworks", category: "Creative Arts", weight: 1 }
        ]}
    ];

    if (typeof mockQuestions === 'undefined' || !mockQuestions.length) {
        mockQuestions = DEFAULT_QUESTIONS.map((q, idx) => ({ ...q, _id: (idx+1).toString() }));
    }

    let editingId = null;
    let choiceFields = [];

    async function loadQuestions() {
        let questions = mockQuestions;
        const container = document.getElementById('questionsList');
        container.innerHTML = '';
        questions.forEach(q => {
            const div = document.createElement('div');
            div.className = 'question-item';
            div.innerHTML = `
                <strong>Q${q.order}: ${q.questionText}</strong> 
                <span style="float:right">
                    <button onclick="editQuestion('${q._id}')">✏️ Edit</button>
                    <button onclick="deleteQuestion('${q._id}')">🗑️ Delete</button>
                </span>
                <div style="font-size:0.8rem; margin-top:8px; color:#2c6e9e;">
                    ${q.choices.map(c => `<span class="badge" style="background:#e6f0fa; padding:2px 8px; margin:2px;">${c.text} (${c.category})</span>`).join(' ')}
                </div>
                <div style="font-size:0.7rem; margin-top:4px;">Active: ${q.isActive ? '✅' : '❌'} | Order: ${q.order}</div>
            `;
            container.appendChild(div);
        });
    }

    function showAddForm() {
        editingId = null;
        choiceFields = [{ text: '', category: 'Technology', weight: 1 }];
        renderForm();
    }

    function editQuestion(id) {
        const q = mockQuestions.find(x => x._id == id);
        if (!q) return;
        editingId = id;
        document.getElementById('qText').value = q.questionText;
        document.getElementById('qOrder').value = q.order;
        document.getElementById('qActive').checked = q.isActive;
        choiceFields = q.choices.map(c => ({ text: c.text, category: c.category, weight: c.weight }));
        renderForm();
    }

    function renderForm() {
        const formHtml = `
            <div id="editForm" class="choice-editor">
                <h4>${editingId ? 'Edit' : 'Add'} Question</h4>
                <input type="text" id="qText" placeholder="Question text" style="width:100%;">
                <div style="display:flex; gap:10px;">
                    <input type="number" id="qOrder" placeholder="Order">
                    <label style="display:flex; align-items:center;"><input type="checkbox" id="qActive" checked> Active</label>
                </div>
                <div id="choicesContainer"></div>
                <button onclick="addChoice()">+ Add Choice</button>
                <button onclick="saveQuestion()" style="background:#2c6e9e;">Save</button>
                <button onclick="cancelEdit()">Cancel</button>
            </div>
        `;
        const existing = document.getElementById('editForm');
        if (existing) existing.remove();
        document.getElementById('questionsList').insertAdjacentHTML('beforebegin', formHtml);
        refreshChoicesUI();
    }

    function refreshChoicesUI() {
        const container = document.getElementById('choicesContainer');
        container.innerHTML = '';
        choiceFields.forEach((ch, idx) => {
            const div = document.createElement('div');
            div.className = 'choice-row';
            div.innerHTML = `
                <input type="text" placeholder="Choice text" value="${ch.text.replace(/"/g, '&quot;')}" data-idx="${idx}" data-field="text" style="flex:2;">
                <select data-idx="${idx}" data-field="category" style="flex:1;">
                    <option value="Technology" ${ch.category === 'Technology' ? 'selected' : ''}>Technology</option>
                    <option value="Healthcare" ${ch.category === 'Healthcare' ? 'selected' : ''}>Healthcare</option>
                    <option value="Education" ${ch.category === 'Education' ? 'selected' : ''}>Education</option>
                    <option value="Business" ${ch.category === 'Business' ? 'selected' : ''}>Business</option>
                    <option value="Creative Arts" ${ch.category === 'Creative Arts' ? 'selected' : ''}>Creative Arts</option>
                </select>
                <input type="number" placeholder="Weight" value="${ch.weight}" data-idx="${idx}" data-field="weight" style="width:80px;">
                <button onclick="removeChoice(${idx})">🗑️</button>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll('#choicesContainer input, #choicesContainer select').forEach(el => {
            el.addEventListener('change', (e) => {
                const idx = parseInt(e.target.dataset.idx);
                const field = e.target.dataset.field;
                if (choiceFields[idx]) choiceFields[idx][field] = e.target.value;
            });
            el.addEventListener('input', (e) => {
                const idx = parseInt(e.target.dataset.idx);
                const field = e.target.dataset.field;
                if (choiceFields[idx] && field === 'text') choiceFields[idx][field] = e.target.value;
            });
        });
    }

    function addChoice() { choiceFields.push({ text: '', category: 'Technology', weight: 1 }); refreshChoicesUI(); }
    function removeChoice(idx) { choiceFields.splice(idx, 1); refreshChoicesUI(); }

    function saveQuestion() {
        const payload = {
            questionText: document.getElementById('qText').value,
            order: parseInt(document.getElementById('qOrder').value) || mockQuestions.length + 1,
            isActive: document.getElementById('qActive').checked,
            choices: choiceFields
        };
        if (editingId) {
            const idx = mockQuestions.findIndex(q => q._id == editingId);
            if (idx !== -1) mockQuestions[idx] = { ...mockQuestions[idx], ...payload, _id: editingId };
        } else {
            payload._id = Date.now().toString();
            mockQuestions.push(payload);
        }
        showMessage('Saved successfully!', 'success');
        cancelEdit();
        loadQuestions();
    }

    function deleteQuestion(id) {
        if (confirm('Delete this question permanently?')) {
            mockQuestions = mockQuestions.filter(q => q._id != id);
            loadQuestions();
            showMessage('Deleted', 'success');
        }
    }

    function cancelEdit() { document.getElementById('editForm')?.remove(); loadQuestions(); }
    function showMessage(msg, type) { 
        const msgDiv = document.getElementById('message');
        msgDiv.textContent = msg;
        msgDiv.className = `message ${type}`;
        msgDiv.style.display = 'block';
        setTimeout(() => msgDiv.style.display = 'none', 2000);
    }

    loadQuestions();
</script>
</body>
