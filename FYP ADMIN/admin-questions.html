<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Questions | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        .choice-editor { background: #f8fafc; padding: 12px; border-radius: 20px; margin: 12px 0; }
        .choice-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
        .choice-row input { flex: 1; min-width: 120px; }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="sidebar">
        <div class="logo"><h2><i class="fas fa-graduation-cap"></i> PathFind</h2><p>College Recommender</p></div>
        <div class="nav">
            <a href="admin-dashboard.html" class="nav-item"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
            <a href="admin-questions.html" class="nav-item active"><i class="fas fa-question-circle"></i><span>Questions</span></a>
            <a href="admin-schools.html" class="nav-item"><i class="fas fa-school"></i><span>Schools</span></a>
            <a href="admin-cms.html" class="nav-item"><i class="fas fa-palette"></i><span>CMS</span></a>
        </div>
    </div>
    <div class="main-content">
        <div class="top-bar">
            <div class="page-title"><h1>Assessment Questions</h1><p>Manage all questions and choices</p></div>
            <div class="admin-profile"><span>Admin</span><div class="avatar">A</div><button onclick="logout()" style="background:#e11d48;">Logout</button></div>
        </div>
        <div class="card">
            <div style="display: flex; justify-content: space-between;">
                <h3><i class="fas fa-list"></i> All Questions</h3>
                <button onclick="showAddForm()">+ Add Question</button>
            </div>
            <div id="questionsList">Loading...</div>
            <div id="message" class="message" style="display:none;"></div>
        </div>
    </div>
</div>
<script src="admin.js"></script>
<script>
    let editingId = null;
    let choiceFields = [];

    async function loadQuestions() {
        try {
            const res = await fetchWithAuth('/questions/all');
            const questions = await res.json();
            const container = document.getElementById('questionsList');
            container.innerHTML = '';
            questions.forEach(q => {
                const div = document.createElement('div');
                div.className = 'question-item';
                div.innerHTML = `
                    <strong>Q${q.order}: ${q.questionText}</strong>
                    <span style="float:right">
                        <button onclick="editQuestion('${q._id}')">✏️ Edit</button>
                        <button onclick="deleteQuestion('${q._id}')">🗑️ Delete</button>
                    </span>
                    <div style="font-size:0.8rem; margin-top:8px;">
                        ${q.choices.map(c => `<span class="badge">${c.text} (${c.category})</span>`).join(' ')}
                    </div>
                    <div style="font-size:0.7rem;">Active: ${q.isActive ? '✅' : '❌'} | Order: ${q.order}</div>
                `;
                container.appendChild(div);
            });
        } catch (err) {
            document.getElementById('questionsList').innerHTML = '<p class="error">Failed to load questions</p>';
        }
    }

    function showAddForm() {
        editingId = null;
        choiceFields = [{ text: '', category: 'Technology', weight: 1 }];
        renderForm();
    }

    function editQuestion(id) {
        fetchWithAuth('/questions/all').then(res => res.json()).then(questions => {
            const q = questions.find(x => x._id == id);
            if (!q) return;
            editingId = id;
            document.getElementById('qText').value = q.questionText;
            document.getElementById('qOrder').value = q.order;
            document.getElementById('qActive').checked = q.isActive;
            choiceFields = q.choices.map(c => ({ text: c.text, category: c.category, weight: c.weight }));
            renderForm();
        });
    }

    function renderForm() {
        const formHtml = `
            <div id="editForm" class="choice-editor">
                <h4>${editingId ? 'Edit' : 'Add'} Question</h4>
                <input type="text" id="qText" placeholder="Question text" style="width:100%;">
                <div style="display:flex; gap:10px;">
                    <input type="number" id="qOrder" placeholder="Order">
                    <label><input type="checkbox" id="qActive" checked> Active</label>
                </div>
                <div id="choicesContainer"></div>
                <button onclick="addChoice()">+ Add Choice</button>
                <button onclick="saveQuestion()" style="background:#2c6e9e;">Save</button>
                <button onclick="cancelEdit()">Cancel</button>
            </div>
        `;
        const existing = document.getElementById('editForm');
        if (existing) existing.remove();
        document.getElementById('questionsList').insertAdjacentHTML('beforebegin', formHtml);
        refreshChoicesUI();
    }

    function refreshChoicesUI() {
        const container = document.getElementById('choicesContainer');
        container.innerHTML = '';
        choiceFields.forEach((ch, idx) => {
            const div = document.createElement('div');
            div.className = 'choice-row';
            div.innerHTML = `
                <input type="text" placeholder="Choice text" value="${ch.text.replace(/"/g, '&quot;')}" data-idx="${idx}" data-field="text" style="flex:2;">
                <select data-idx="${idx}" data-field="category" style="flex:1;">
                    <option ${ch.category === 'Technology' ? 'selected' : ''}>Technology</option>
                    <option ${ch.category === 'Healthcare' ? 'selected' : ''}>Healthcare</option>
                    <option ${ch.category === 'Education' ? 'selected' : ''}>Education</option>
                    <option ${ch.category === 'Business' ? 'selected' : ''}>Business</option>
                    <option ${ch.category === 'Creative Arts' ? 'selected' : ''}>Creative Arts</option>
                </select>
                <input type="number" placeholder="Weight" value="${ch.weight}" data-idx="${idx}" data-field="weight" style="width:80px;">
                <button onclick="removeChoice(${idx})">🗑️</button>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll('#choicesContainer input, #choicesContainer select').forEach(el => {
            el.addEventListener('change', (e) => {
                const idx = parseInt(e.target.dataset.idx);
                const field = e.target.dataset.field;
                if (choiceFields[idx]) choiceFields[idx][field] = e.target.value;
            });
            el.addEventListener('input', (e) => {
                const idx = parseInt(e.target.dataset.idx);
                const field = e.target.dataset.field;
                if (choiceFields[idx] && field === 'text') choiceFields[idx][field] = e.target.value;
            });
        });
    }

    function addChoice() { choiceFields.push({ text: '', category: 'Technology', weight: 1 }); refreshChoicesUI(); }
    function removeChoice(idx) { choiceFields.splice(idx, 1); refreshChoicesUI(); }

    async function saveQuestion() {
        const payload = {
            questionText: document.getElementById('qText').value,
            order: parseInt(document.getElementById('qOrder').value),
            isActive: document.getElementById('qActive').checked,
            choices: choiceFields
        };
        try {
            if (editingId) {
                await fetchWithAuth(`/questions/${editingId}`, { method: 'PUT', body: JSON.stringify(payload) });
            } else {
                await fetchWithAuth('/questions', { method: 'POST', body: JSON.stringify(payload) });
            }
            showMessage('message', 'Saved successfully!', 'success');
            cancelEdit();
            loadQuestions();
        } catch (err) {
            showMessage('message', 'Error saving question', 'error');
        }
    }

    async function deleteQuestion(id) {
        if (confirm('Delete this question permanently?')) {
            try {
                await fetchWithAuth(`/questions/${id}`, { method: 'DELETE' });
                loadQuestions();
                showMessage('message', 'Deleted', 'success');
            } catch (err) {
                showMessage('message', 'Delete failed', 'error');
            }
        }
    }

    function cancelEdit() { document.getElementById('editForm')?.remove(); loadQuestions(); }

    if (checkAuth()) {
        loadQuestions();
        highlightActiveNav();
    }
</script>
</body>
</html>
